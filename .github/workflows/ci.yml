name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check src/ app.py eval/

      - name: Syntax / import check
        run: |
          python -m py_compile src/*.py app.py eval/*.py

      - name: Run unit tests
        run: pytest tests/ -v
        continue-on-error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t supportiq-api:${{ github.sha }} .

      - name: Build Streamlit image
        run: docker build -f Dockerfile.streamlit -t supportiq-ui:${{ github.sha }} .

      # To push to a registry and deploy, add steps here, e.g.:
      # - name: Push to registry
      #   run: |
      #     echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login -u ${{ secrets.REGISTRY_USER }} --password-stdin
      #     docker push supportiq-api:${{ github.sha }}
